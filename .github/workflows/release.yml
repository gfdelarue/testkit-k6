name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.10
          cache: false
      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - run: npm run release-check -- "$GITHUB_REF_NAME"
      - name: Regenerate the source archive and build every target
        run: npm run build -- --refresh-source --all
      - run: npm run pack
      - name: Publish the source package
        run: npm publish .state/packages/testkit-engine-k6-source --access public
      - name: Publish the platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            npm publish ".state/packages/testkit-engine-k6-$target" --access public
          done
      - run: npm run verify-published
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: .state/tarballs/
          if-no-files-found: error
