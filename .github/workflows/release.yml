name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.10
          cache: false
      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - run: npm run release-check -- "$GITHUB_REF_NAME"
      - name: Regenerate the source archive and build every target
        run: npm run build -- --refresh-source --all
      - run: npm run pack
      - name: Publish every package with provenance
        run: npm run publish-packages
