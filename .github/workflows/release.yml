name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, testkit-k6, orthrus-ubuntu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.10
          cache: false
      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - run: npm run release-check -- "$GITHUB_REF_NAME"
      - name: Regenerate the source archive and build every target
        run: npm run build -- --refresh-source --all
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: .state/tarballs/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: .state/tarballs/
      - name: Publish every package with provenance
        run: npm run publish-packages
      - run: npm run verify-published
