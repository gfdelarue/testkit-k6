name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, testkit-k6, orthrus-ubuntu]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
