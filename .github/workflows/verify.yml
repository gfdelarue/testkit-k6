name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.10
          cache: false
      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - name: Regenerate the source archive and build every target
        run: npm run build -- --refresh-source --all
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: .state/tarballs/
          if-no-files-found: error
